<svg xmlns="http://www.w3.org/2000/svg" width="490" height="300" viewBox="0 0 490 300">
  <style>
    .title { font-family: monospace; font-size: 14px; font-weight: bold; fill: #58a6ff; }
    .label { font-family: monospace; font-size: 12px; font-weight: bold; fill: #79c0ff; }
    .value { font-family: monospace; font-size: 12px; fill: #c9d1d9; }
    .prompt { font-family: monospace; font-size: 12px; fill: #7ee787; }
  </style>
  <rect width="100%" height="100%" fill="#0d1117" rx="6" stroke="#30363d" stroke-width="1" />
  <g transform="translate(20, 30)">
    <text class="title">doesntmatter1710@github ~ $</text>
    <line x1="0" y1="12" x2="450" y2="12" stroke="#30363d" stroke-width="1" />
    <g opacity="0" transform="translate(0, 40)">
      <text class="prompt">&gt; </text>
      <text x="15" class="label">OS:</text>
      <text x="120" class="value">Windows / WSL (Ubuntu)</text>
      <animate attributeName="opacity" to="1" begin="0.0s" dur="0.2s" fill="freeze" />
    </g>
    <g opacity="0" transform="translate(0, 75)">
      <text class="prompt">&gt; </text>
      <text x="15" class="label">Languages:</text>
      <text x="120" class="value">C++, Python, JavaScript</text>
      <animate attributeName="opacity" to="1" begin="0.15s" dur="0.2s" fill="freeze" />
    </g>
    <g opacity="0" transform="translate(0, 110)">
      <text class="prompt">&gt; </text>
      <text x="15" class="label">Stack:</text>
      <text x="120" class="value">Node.js, Express, MongoDB, React, Tailwind</text>
      <animate attributeName="opacity" to="1" begin="0.3s" dur="0.2s" fill="freeze" />
    </g>
    <g opacity="0" transform="translate(0, 145)">
      <text class="prompt">&gt; </text>
      <text x="15" class="label">Focus:</text>
      <text x="120" class="value">Full-Stack Dev, OSINT & Security Tools</text>
      <animate attributeName="opacity" to="1" begin="0.44999999999999996s" dur="0.2s" fill="freeze" />
    </g>
    <g opacity="0" transform="translate(0, 180)">
      <text class="prompt">&gt; </text>
      <text x="15" class="label">Tools:</text>
      <text x="120" class="value">VS Code, Git, DaVinci Resolve</text>
      <animate attributeName="opacity" to="1" begin="0.6s" dur="0.2s" fill="freeze" />
    </g>
  </g>
</svg>